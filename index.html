<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMAINHERE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'RetroFont';
            src: url('typo.ttf') format('truetype');
            font-display: swap;
        }
        
        :root {
            --heart: #ff0000; --yellow: #ffff00;
            --bg: #000; --bgimg: none; --box: #000;
            --fg: #fff; --dim: #d1d5db; --border: #fff;
            --accent: #facc15; --hover-text: #b8a800;
            --input-text: #00ff00; --input-ph: #2c6b2c;
            --shadow: #3a3a3a; --star: 255,255,255;
        }
        
        :root[data-theme="deltarune"] {
            --bg: #030821;
            --bgimg: linear-gradient(180deg, #02061a 0%, #0a1650 55%, #14246e 100%);
            --box: #050c33;
            --fg: #e8f0ff; --dim: #9db4ff; --border: #8fb4ff;
            --accent: #ff7ad9; --hover-text: #1b2a8a;
            --input-text: #8ff0ff; --input-ph: #3b5aa8;
            --shadow: #0d1a66; --star: 150,190,255;
        }
        .shine { position: relative; display: inline-block; }
        .shine::after {
            content: attr(data-text);
            position: absolute; inset: 0;
            color: transparent; text-shadow: none; pointer-events: none;
            background: linear-gradient(100deg, transparent 38%, #00e5ff 50%, transparent 62%);
            background-size: 250% 100%;
            -webkit-background-clip: text; background-clip: text;
            animation: sweep 3.6s linear infinite;
        }
        @keyframes sweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }
        .c-accent { color: var(--accent); }
        .c-dim { color: var(--dim); }

        html, body { height: 100%; }
        body {
            background: var(--bg) var(--bgimg) fixed;
            color: var(--fg);
            font-family: 'RetroFont', 'VT323', 'Courier New', monospace;
            font-size: 20px;
            image-rendering: pixelated;
            overflow-x: hidden;
        }
        #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .layer { position: relative; z-index: 1; }

        .undertale-box { border: 4px solid var(--border); background: var(--box); }
        .undertale-btn {
            border: 4px solid var(--border); background: var(--box); color: var(--fg);
            cursor: pointer; user-select: none; transition: none; position: relative;
        }
        .undertale-btn:hover, .undertale-btn:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
        .undertale-btn:hover .heart-text, .undertale-btn:focus-visible .heart-text { color: var(--hover-text); }
        .undertale-btn:disabled { opacity: .5; cursor: wait; }
        .heart-icon { color: var(--heart); display: inline-block; width: 1.4em; opacity: 0; }
        #toggleBtn::after, #hereBtn::after { content: ''; display: inline-block; width: 1.4em; }
        .undertale-btn:hover .heart-icon, .undertale-btn:focus-visible .heart-icon { opacity: 1; }

        .logo { height: 1em; width: auto; display: inline-block; vertical-align: -0.12em; image-rendering: auto; }
        
        .soul { color: var(--heart); display: inline-block; animation: bob 1.4s steps(2) infinite; }
        @keyframes bob { 50% { transform: translateY(-6px); } }

        .title { animation: drop .9s steps(6) both; letter-spacing: .18em; text-shadow: 4px 4px 0 var(--shadow); }
        @keyframes drop { from { transform: translateY(-40px); opacity: 0; } }

        #dialog { min-height: 4.6rem; }
        #dialog.special a { color: var(--yellow); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
        #dialog.special a:hover, #dialog.special a:focus-visible { background: var(--yellow); color: #000; outline: none; text-decoration: none; }
        #dialog::after { content: '▮'; margin-left: 4px; animation: blinker 1s steps(1) infinite; }
        .blink { animation: blinker 1s steps(1) infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .undertale-input { background: var(--box); border: 3px solid var(--border); color: var(--input-text); font-family: inherit; font-size: 1.05rem; }
        .undertale-input:focus { outline: none; border-color: var(--accent); }
        .undertale-input::placeholder { color: var(--input-ph); }
        #contactBox.shake { animation: shake .35s steps(4); }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .hp-bar { display: inline-block; width: 70px; height: 16px; background: #c00000; vertical-align: middle; }
        .hp-bar i { display: block; height: 100%; width: 100%; background: var(--yellow); }

        #topbar { position: fixed; top: 12px; right: 12px; z-index: 5; display: flex; gap: 8px; align-items: center; }
        #topbar .undertale-btn { padding: 2px 10px; border-width: 3px; font-size: .9rem; }
        .off { display: none !important; }
        #hereBtn.done, #hereBtn.done:hover { background: var(--box); color: var(--yellow); border-color: var(--yellow); opacity: 1; cursor: default; }
        #hereBtn.done:hover .heart-text { color: var(--yellow); }
        #hereBtn.done .heart-icon { opacity: 0; }
        .flash { animation: flash .7s steps(4); }
        @keyframes flash { 50% { color: var(--yellow); transform: scale(1.08); } }
        .lang-btn.active { background: var(--fg); color: var(--bg); }

        @media (prefers-reduced-motion: reduce) {
            .flash, .shine::after, .soul, .title, #dialog::after, .blink, #contactBox.shake { animation: none; }
        }
    </style>
<script>
        (function () {
            var host = (location.hostname || '').toLowerCase();
            var q = new URLSearchParams(location.search).get('theme');
            var theme = (q === 'undertale' || host.indexOf('undertale') !== -1) ? 'undertale' : 'deltarune';
            document.documentElement.setAttribute('data-theme', theme);
            window.__SITE = host && host !== 'localhost' && host.indexOf('.') !== -1 ? host.replace(/^www\./,'') : theme + '.store';
        })();
    </script>
</head>
<body class="select-none">
    <canvas id="stars"></canvas>
    <div id="topbar">
        <div class="flex gap-1">
            <button class="undertale-btn lang-btn" data-lang="es" onclick="setLang('es')" aria-pressed="false">ES</button>
            <button class="undertale-btn lang-btn" data-lang="en" onclick="setLang('en')" aria-pressed="false">EN</button>
        </div>
        <button id="soundBtn" class="undertale-btn" onclick="toggleSound()" aria-pressed="false">SOUND: OFF</button>
    </div>

    <div class="layer min-h-screen flex flex-col justify-between items-center p-4 sm:p-8">

        <header class="w-full text-center mt-10 sm:mt-14">
            <h1 class="title text-4xl sm:text-6xl md:text-7xl uppercase font-bold">
                <span class="soul"><img src="logo.svg" alt="" class="logo" onerror="this.replaceWith('♥')"></span> <span class="site-name shine">DOMAINHERE</span>
            </h1>
        </header>

        <main class="w-full max-w-xl my-8 flex flex-col items-center">
            
            <div class="undertale-box w-full p-5 mb-8 text-lg sm:text-xl leading-snug">
                <p id="dialog" aria-live="polite"></p>
            </div>

            <button id="toggleBtn" onclick="toggleContactForm()" class="undertale-btn px-6 py-3 text-lg sm:text-xl tracking-wider uppercase mb-8 w-full flex items-center justify-center">
                <span class="heart-icon"><img src="logo.svg" alt="" class="logo" onerror="this.replaceWith('♥')"></span>
                <span class="heart-text" data-i18n="drop">Need something from me?</span>
            </button>

            <div id="contactBox" class="undertale-box w-full p-6 mb-8 hidden">
                <div class="text-base c-accent mb-4" data-i18n="hint">
                    * (Fill out the box to send a message to the owner of this lonely place...)
                </div>

                <form id="contactForm" onsubmit="handleFormSubmit(event)" class="flex flex-col gap-4">
                    <input type="hidden" name="access_key" value="fc082d27-cc7e-4810-83d1-811c93e37db7">
                    <input type="hidden" name="subject" value="Nuevo mensaje desde DOMAINHERE">
                    <input type="hidden" name="from_name" value="DOMAINHERE">
                    <input type="hidden" name="web_origen" id="webOrigen" value="">
                    <input type="checkbox" name="botcheck" class="hidden" style="display:none" tabindex="-1" autocomplete="off">

                    <div>
                        <label for="email" class="block text-base uppercase mb-1 c-dim" data-i18n="labelEmail">* Your Email / Contact:</label>
                        <input type="text" id="email" name="email" required placeholder="human@example.com" data-i18n-ph="phEmail" class="undertale-input w-full p-2 rounded-none">
                    </div>
                    <div>
                        <label for="message" class="block text-base uppercase mb-1 c-dim" data-i18n="labelMsg">* Your Idea or Message:</label>
                        <textarea id="message" name="message" rows="3" required placeholder="Type something cool..." data-i18n-ph="phMsg" class="undertale-input w-full p-2 rounded-none resize-none"></textarea>
                    </div>
                    <button type="submit" id="sendBtn" data-i18n="send" class="undertale-btn py-2 px-5 text-lg uppercase tracking-widest self-end mt-2">
                        [ SEND ]
                    </button>
                </form>

                <div id="feedbackMsg" class="hidden mt-4 text-base text-center"></div>
            </div>
        <button id="hereBtn" onclick="sayHere()" class="undertale-btn off px-6 py-3 text-lg sm:text-xl tracking-wider uppercase w-full flex items-center justify-center">
                <span class="heart-icon"><img src="logo.svg" alt="" class="logo" onerror="this.replaceWith('♥')"></span>
                <span id="hereText" class="heart-text" data-i18n="here">I was here</span>
            </button>
        </main>

        <footer class="w-full text-center pb-4 c-dim">
            <div id="countLine" class="off mb-3 text-xl c-accent"><span id="countText"></span></div>
            <div class="mb-3 text-lg">
                <span class="site-name">DOMAINHERE</span> &nbsp; LV 1 &nbsp; HP <span class="hp-bar"><i></i></span> 20 / 20
            </div>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-1 sm:gap-6 text-base c-dim" style="opacity:.8">
                <span data-i18n="footerNote">* I don't know what to put on this website</span>
                <span class="hidden sm:inline">•</span>
                <span style="opacity:.7">© 2026 <span class="site-name">DOMAINHERE</span></span>
            </div>
            <div class="mt-3 text-sm c-dim" style="opacity:.6" data-i18n="fan">* Fan site. Not affiliated with Toby Fox, Undertale or Deltarune.</div>
        </footer>
    </div>

    <script>
        
        (function () {
            var name = window.__SITE.toUpperCase();
            document.title = name;
            document.querySelectorAll('.site-name').forEach(function (n) { n.textContent = name; n.setAttribute('data-text', name); });
            var f = document.querySelector('[name="from_name"]'); if (f) f.value = name;
        })();

        (function () {
            const c = document.getElementById('stars'), ctx = c.getContext('2d');
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let stars = [], last = 0;
            function init() {
                c.width = innerWidth; c.height = innerHeight;
                stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 14000) }, () => {
                    const big = Math.random() < .2;
                    return {
                        x: Math.floor(Math.random() * c.width / 4) * 4,
                        y: Math.random() * c.height,
                        s: big ? 6 : 3,
                        v: big ? 40 + Math.random() * 25 : 15 + Math.random() * 15,
                        p: Math.random() * 6.28
                    };
                });
            }
            function draw(t) {
                const dt = last ? Math.min((t - last) / 1000, .1) : 0; last = t;
                const rgb = getComputedStyle(document.documentElement).getPropertyValue('--star');
                ctx.clearRect(0, 0, c.width, c.height);
                for (const s of stars) {
                    if (!reduce) {
                        s.y += s.v * dt;
                        if (s.y > c.height) { s.y = -s.s; s.x = Math.floor(Math.random() * c.width / 4) * 4; }
                    }
                    const a = reduce ? .5 : .2 + .5 * Math.abs(Math.sin(t / 1400 + s.p));
                    ctx.fillStyle = 'rgba(' + rgb + ',' + a + ')';
                    ctx.fillRect(s.x, Math.floor(s.y / 3) * 3, s.s, s.s);
                }
                if (!reduce) requestAnimationFrame(draw);
            }
            addEventListener('resize', init);
            init(); requestAnimationFrame(draw);
        })();

        let soundOn = false, audioCtx = null;
        function toggleSound() {
            soundOn = !soundOn;
            if (soundOn && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (soundOn && audioCtx.state === 'suspended') audioCtx.resume();
            updateSoundLabel();
            if (soundOn) blip();
        }
        function updateSoundLabel() {
            const b = document.getElementById('soundBtn');
            b.textContent = t(soundOn ? 'soundOn' : 'soundOff');
            b.setAttribute('aria-pressed', soundOn);
        }
        let autoSound = true;
        function firstInteraction(e) {
            if (!autoSound) return;
            autoSound = false;
            if (e.target.closest && e.target.closest('#soundBtn')) return;
            if (!soundOn) toggleSound();
        }
        document.addEventListener('click', firstInteraction, true);
        document.addEventListener('keydown', firstInteraction, true);

        function blip() {
            if (!soundOn || !audioCtx) return;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'square'; o.frequency.value = 380 + Math.random() * 60;
            g.gain.setValueAtTime(.04, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .06);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + .06);
        }

        const I18N = {
            en: {
                soundOn: "SOUND: ON", soundOff: "SOUND: OFF",
                drop: "Need something from me?",
                hint: "* (Fill out the box to send a message to the owner of this lonely place...)",
                labelEmail: "* Your Email / Contact:", labelMsg: "* Your Idea or Message:",
                phEmail: "human@example.com", phMsg: "Type something cool...",
                send: "[ SEND ]", sending: "[ SENDING... ]",
                here: "I was here",
                hereDone: "* You were here. We will remember.",
                hereError: "* The void rejected you. Try again.",
                countOne: "* {n} human has been here",
                countMany: "* {n} humans have been here",
                countLoading: "* counting humans...",
                sent: "* Message sent. You are filled with determination.",
                error: "* ERROR: the message got lost in the void. Try again later.",
                footerNote: "* I don't know what to put on this website",
                fan: "* Fan site. Not affiliated with Toby Fox, Undertale or Deltarune."
            },
            es: {
                soundOn: "SONIDO: SÍ", soundOff: "SONIDO: NO",
                drop: "¿Necesitas algo de mí?",
                hint: "* (Llena la caja para enviar un mensaje al dueño de este lugar solitario...)",
                labelEmail: "* Tu correo / contacto:", labelMsg: "* Tu idea o mensaje:",
                phEmail: "humano@ejemplo.com", phMsg: "Escribe algo genial...",
                send: "[ ENVIAR ]", sending: "[ ENVIANDO... ]",
                here: "Yo estuve aquí",
                hereDone: "* Estuviste aquí. Lo recordaremos.",
                hereError: "* El vacío te rechazó. Inténtalo otra vez.",
                countOne: "* {n} humano ha estado aquí",
                countMany: "* {n} humanos han estado aquí",
                countLoading: "* contando humanos...",
                sent: "* Mensaje enviado. Estás lleno de determinación.",
                error: "* ERROR: el mensaje se perdió en el vacío. Inténtalo más tarde.",
                footerNote: "* No sé qué poner en esta web",
                fan: "* Sitio de fans. Sin afiliación con Toby Fox, Undertale ni Deltarune."
            }
        };

        const DIALOG = {
            en: {
                intro: "* i bought this domain just for fun.",
                pool: [
                    "* Susie says this website is lame. She is not wrong.",
                    "* Ralsei thinks this website is great. Ralsei thinks everything is great.",
                    "* Kris says nothing. Kris has never said anything.",
                    "* Noelle asks if the website is okay. The website is not okay.",
                    "* Spamton calls this domain a BIG SHOT deal. It cost one dollar.",
                    "* Lancer says he built this website. He did not.",
                    "* Berdly read the code and says it could be better. Nobody asked Berdly.",
                    "* Toriel asks if you have eaten today. Go eat something.",
                    "* Ralsei offers you a scarf. It is the only thing on this website.",
                    "* Susie wants to know where the snacks are. There are no snacks here.",
                    "* Kris looks at the website. Kris looks at you. Kris leaves.",
                    "* Ralsei asks you not to read the source code. You read it anyway.",
                    "* Noelle says it is cold in here. The server is fine. It is the vibes.",
                    "* Susie clicked every button on this page. Nothing happened. She is mad.",
                    "* Lancer shouts something about being a bad guy. Nobody is listening.",
                    "* This website has no content. Ralsei is proud of it anyway.",
                    "* Berdly says he would have used React. You feel a wave of disinterest.",
                    "* A cat walks across the keyboard. The code is now worse. Nobody notices.",
                    "* Spamton wants to sell you a sofa. You can't afford it. Neither can he.",
                    "* Susie is chewing on something. You decide not to ask what.",
                    "* You stare at the empty space where the content should be. It stares back.",
                    "* The domain cost one dollar. You feel like a business tycoon.",
                    "* A lone cursor blinks in the void. It has been blinking for a while.",
                    "* The contact form works. You are not sure how. Neither is the form.",
                    "* You smell something burning. It is the free hosting.",
                    "* There is a button here. Pressing it will not change your life.",
                    "* The stars twinkle. They are just pixels, but they are trying their best.",
                    "* This website has been under construction since the day it was born.",
                    "* You feel a sudden urge to buy another domain.",
                    "* The text keeps typing. Nobody is reading it. It keeps typing.",
                    "* You pet the website. Nothing happens. You feel better anyway.",
                    "* Somewhere, a TikTok algorithm stirs.",
                    "* You check the page for secrets. There are none. Maybe one.",
                    "* Loading the vibes... done.",
                    "* Your wallet is empty. You are the proud owner of a website.",
                    "* The wind blows. It is a very small website, so it hardly notices.",
                    "* this is peak."
                ]
            },
            es: {
                intro: "* compré este dominio solo por diversión.",
                pool: [
                    "* Susie dice que esta web es aburrida. No se equivoca.",
                    "* Ralsei cree que esta web es genial. Ralsei cree que todo es genial.",
                    "* Kris no dice nada. Kris nunca ha dicho nada.",
                    "* Noelle pregunta si la web está bien. La web no está bien.",
                    "* Spamton dice que este dominio es una oferta BIG SHOT. Costó un dólar.",
                    "* Lancer dice que él hizo esta web. No fue él.",
                    "* Berdly leyó el código y dice que podría ser mejor. Nadie le preguntó a Berdly.",
                    "* Toriel pregunta si ya comiste hoy. Anda a comer algo.",
                    "* Ralsei te ofrece una bufanda. Es lo único que hay en esta web.",
                    "* Susie quiere saber dónde están los snacks. Aquí no hay snacks.",
                    "* Kris mira la web. Kris te mira a ti. Kris se va.",
                    "* Ralsei te pide que no leas el código fuente. Lo lees igual.",
                    "* Noelle dice que hace frío aquí. El servidor está bien. Son las vibras.",
                    "* Susie hizo clic en todos los botones. No pasó nada. Está furiosa.",
                    "* Lancer grita algo sobre ser el malo. Nadie lo escucha.",
                    "* Esta web no tiene contenido. Ralsei está orgulloso igual.",
                    "* Berdly dice que habría usado React. Sientes una ola de desinterés.",
                    "* Un gato camina sobre el teclado. El código ahora está peor. Nadie lo nota.",
                    "* Spamton quiere venderte un sofá. No puedes pagarlo. Él tampoco.",
                    "* Susie está masticando algo. Decides no preguntar qué.",
                    "* Miras el espacio vacío donde debería ir el contenido. Te devuelve la mirada.",
                    "* El dominio costó un dólar. Te sientes un magnate de los negocios.",
                    "* Un cursor solitario parpadea en el vacío. Lleva un buen rato parpadeando.",
                    "* El formulario de contacto funciona. No sabes cómo. El formulario tampoco.",
                    "* Hueles algo quemándose. Es el hosting gratis.",
                    "* Hay un botón aquí. Pulsarlo no cambiará tu vida.",
                    "* Las estrellas brillan. Son solo píxeles, pero hacen su mejor esfuerzo.",
                    "* Esta web está en construcción desde el día en que nació.",
                    "* Sientes un impulso repentino de comprar otro dominio.",
                    "* El texto sigue escribiéndose. Nadie lo lee. Sigue escribiéndose.",
                    "* Acaricias la web. No pasa nada. Te sientes mejor igual.",
                    "* En algún lugar, el algoritmo de TikTok se agita.",
                    "* Buscas secretos en la página. No hay ninguno. Quizás uno.",
                    "* Cargando las vibras... listo.",
                    "* Tu billetera está vacía. Eres el orgulloso dueño de una web.",
                    "* Sopla el viento. Es una web tan pequeña que apenas lo nota.",
                    "* esto es peak."
                ]
            }
        };

        let lang = '';
        try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
        if (lang !== 'es' && lang !== 'en') lang = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
        function t(k) { return I18N[lang][k]; }

        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-ph]').forEach(function (n) { n.placeholder = t(n.getAttribute('data-i18n-ph')); });
            document.querySelectorAll('.lang-btn').forEach(function (b) {
                const on = b.getAttribute('data-lang') === lang;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on);
            });
            updateSoundLabel();
            renderCount();
        }

        function setLang(l) {
            if (l === lang) return;
            lang = l;
            try { localStorage.setItem('lang', l); } catch (e) {}
            applyLang();
            typeLine();
        }

        const SPECIAL = DIALOG.en.pool.length;
        const SPECIAL_TEXT = "* Tiktok: @Codigo_Determinacion";
        const SPECIAL_URL = "https://www.tiktok.com/@Codigo_Determinacion";
        const order = Array.from({ length: SPECIAL + 1 }, function (_, i) { return i; });
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        const el = document.getElementById('dialog');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let li = 0, runId = 0;

        function lineText(i) {
            if (i === 0) return DIALOG[lang].intro;
            const idx = order[i - 1];
            return idx === SPECIAL ? SPECIAL_TEXT : DIALOG[lang].pool[idx];
        }

        function typeLine() {
            const my = ++runId, text = lineText(li);
            const special = text === SPECIAL_TEXT;
            let i = 0, target = el;
            el.textContent = '';
            el.classList.toggle('special', special);
            if (special) {
                target = document.createElement('a');
                target.href = SPECIAL_URL;
                target.target = '_blank';
                target.rel = 'noopener noreferrer';
                el.appendChild(target);
            }
            const advance = function () {
                if (my !== runId) return;
                li = (li + 1) % (order.length + 1);
                typeLine();
            };
            if (reduceMotion) { target.textContent = text; setTimeout(advance, special ? 6000 : 3500); return; }
            (function tick() {
                if (my !== runId) return;
                target.textContent = text.slice(0, ++i);
                if (text[i - 1] !== ' ') blip();
                if (i < text.length) setTimeout(tick, 45);
                else setTimeout(advance, special ? 5000 : 2200);
            })();
        }

        const SUPA_URL = "https://zeqsdzscyofsroiliqfy.supabase.co";
        const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcXNkenNjeW9mc3JvaWxpcWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NzkwOTgsImV4cCI6MjEwNzE1NTA5OH0.TpdkCIj6cc_sb-WFqqDGcLzxx_cXLUltaUuMYJIkD6o";
        let sb = null, total = null, hereDone = false;

        function renderCount() {
            const line = document.getElementById('countText');
            if (total === null) { line.textContent = t('countLoading'); return; }
            const n = total.toLocaleString(lang === 'es' ? 'es' : 'en');
            line.textContent = t(total === 1 ? 'countOne' : 'countMany').replace('{n}', n);
        }

        function setTotal(n) {
            const changed = total !== null && Number(n) !== total;
            total = Number(n);
            renderCount();
            if (changed) {
                const l = document.getElementById('countLine');
                l.classList.remove('flash'); void l.offsetWidth; l.classList.add('flash');
            }
        }

        function markHere() {
            hereDone = true;
            const btn = document.getElementById('hereBtn');
            btn.classList.add('done');
            btn.disabled = true;
            document.getElementById('hereText').setAttribute('data-i18n', 'hereDone');
            applyLang();
        }

        async function sayHere() {
            if (!sb || hereDone) return;
            const btn = document.getElementById('hereBtn'), txt = document.getElementById('hereText');
            btn.disabled = true;
            try {
                const sess = (await sb.auth.getSession()).data.session;
                if (!sess) throw new Error('no session');
                const r = await sb.from('visitas').insert({ user_id: sess.user.id });
                if (r.error && r.error.code !== '23505') throw r.error;
                markHere();
                const c = await sb.from('contador').select('total').eq('id', 1).single();
                if (c.data) setTotal(c.data.total);
            } catch (e) {
                txt.textContent = t('hereError');
                setTimeout(function () { txt.textContent = t('here'); btn.disabled = false; }, 2500);
            }
        }

        async function initPresence() {
            if (!window.supabase || SUPA_URL.indexOf('PEGA_AQUI') === 0) return;
            document.getElementById('hereBtn').classList.remove('off');
            document.getElementById('countLine').classList.remove('off');
            renderCount();
            try {
                sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
                const c = await sb.from('contador').select('total').eq('id', 1).single();
                if (c.data) setTotal(c.data.total);
                sb.channel('contador-vivo')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'contador' }, function (p) { setTotal(p.new.total); })
                    .subscribe();
                let sess = (await sb.auth.getSession()).data.session;
                if (!sess) sess = (await sb.auth.signInAnonymously()).data.session;
                if (!sess) { document.getElementById('hereBtn').classList.add('off'); return; }
                const mine = await sb.from('visitas').select('user_id').maybeSingle();
                if (mine.data) markHere();
            } catch (e) {
                document.getElementById('hereBtn').classList.add('off');
            }
        }

        applyLang();
        typeLine();
        initPresence();

        function toggleContactForm() {
            const box = document.getElementById('contactBox');
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                setTimeout(() => {
                    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    document.getElementById('email').focus();
                }, 100);
            } else box.classList.add('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = document.getElementById('contactForm');
            const box = document.getElementById('contactBox');
            const feedback = document.getElementById('feedbackMsg');
            const btn = document.getElementById('sendBtn');

            const host = window.location.hostname || 'local (archivo)';
            document.getElementById('webOrigen').value = host + ' | ' + window.location.href;
            form.querySelector('[name="subject"]').value = 'Nuevo mensaje desde ' + host;

            btn.textContent = t('sending');
            btn.disabled = true;

            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(form)
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                feedback.textContent = t('sent');
                feedback.className = 'mt-4 text-base text-center c-accent';
                form.reset();
            } catch (err) {
                feedback.textContent = t('error');
                feedback.className = 'mt-4 text-base text-center text-red-500';
            }

            box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
            btn.textContent = t('send');
            btn.disabled = false;
            setTimeout(() => feedback.classList.add('hidden'), 5000);
        }
    </script>
